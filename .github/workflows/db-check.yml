name: Database Check

on: push

jobs:
  db:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : récupérer le code du dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # Étape 2 : préparer la base de données
      - name: Setup PostgreSQL
        run: bash db/setup.sh

      # Étape 3 : afficher les étudiants
      - name: Show students
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d tp -c "SELECT * FROM students;"
